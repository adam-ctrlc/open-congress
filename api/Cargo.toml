[package]
name = "governance-api"
version = "0.1.0"
edition = "2024"

[lib]
name = "governance_api"
path = "src/lib.rs"

# Local development server
[[bin]]
name = "governance-api"
path = "src/main.rs"

# Vercel function entrypoint (one binary per file in api/)
[[bin]]
name = "axum"
path = "api/axum.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
moka = { version = "0.12.15", features = ["future"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "gzip", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

[target."cfg(unix)".dependencies]
vercel_runtime = { version = "2.4.0", features = ["axum"] }
