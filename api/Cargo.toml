[package]
name = "governance-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
moka = { version = "0.12.15", features = ["future"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "gzip", "charset"] }
sea-orm = "2.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
